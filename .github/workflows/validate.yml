name: Validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build numbered debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}
      - name: Stage APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk OBD-Atlas-0.1.0-build-${{ github.run_number }}.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OBD-Atlas-Android-build-${{ github.run_number }}
          path: OBD-Atlas-0.1.0-build-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt
      - run: python -m py_compile backend/app/main.py
      - run: python -m unittest discover -s backend -p 'test_*.py'
        env:
          PYTHONPATH: backend
      - run: docker compose config
        env:
          OBD_ATLAS_API_KEY: ci-validation-only
