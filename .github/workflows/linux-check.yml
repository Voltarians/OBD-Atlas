name: Linux Frontend Check

on:
  push:
    branches:
      - main
      - 'build/**'
  pull_request:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop and CAN prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev can-utils

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux platform project
        run: flutter create --platforms=linux --project-name obd_atlas .

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Linux release
        run: flutter build linux --release -t lib/main_linux.dart

      - name: Upload Linux release bundle
        uses: actions/upload-artifact@v4
        with:
          name: OBD-Atlas-Linux-x64-release
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
