name: Refine voice runtime v2

on:
  push:
    branches:
      - feat/voice-event-markers

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/voice-event-markers
      - name: Apply runtime-owned voice lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rp = Path('lib/core/atlas_runtime.dart')
          r = rp.read_text(encoding='utf-8')
          if "import 'voice_annotation_capture.dart';" not in r:
              r = r.replace("import 'signal_discovery.dart';\n", "import 'signal_discovery.dart';\nimport 'voice_annotation_capture.dart';\n", 1)
          if 'voiceAnnotations.addListener(notifyListeners);' not in r:
              r = r.replace('    capture.addListener(notifyListeners);\n  }\n', '    capture.addListener(notifyListeners);\n    voiceAnnotations.addListener(notifyListeners);\n  }\n', 1)
          if 'final VoiceAnnotationCapture voiceAnnotations' not in r:
              r = r.replace(
                  '  final SignalDiscoverySession discovery = SignalDiscoverySession();\n\n  int totalFrames = 0;\n',
                  '  final SignalDiscoverySession discovery = SignalDiscoverySession();\n  final VoiceAnnotationCapture voiceAnnotations = VoiceAnnotationCapture();\n  EventMarkerMode eventMarkerMode = EventMarkerMode.click;\n\n  int totalFrames = 0;\n',
                  1,
              )

          old_start = """  Future<File> startCapture({String eventLabel = 'Event'}) async {
    if (!anyConnected) {
      throw StateError('Connect at least one Atlas channel before starting a capture.');
    }
    discovery.start(label: eventLabel);
    notifyListeners();
    try {
      final file = await capture.start();
      markCaptureEvent('Capture start: ${discovery.eventLabel}', source: 'atlas');
      return file;
    } catch (_) {
      discovery.finish();
      notifyListeners();
      rethrow;
    }
  }
"""
          new_start = """  Future<File> startCapture({
    String eventLabel = 'Event',
    EventMarkerMode markerMode = EventMarkerMode.click,
  }) async {
    if (!anyConnected) {
      throw StateError('Connect at least one Atlas channel before starting a capture.');
    }
    eventMarkerMode = markerMode;
    discovery.start(label: eventLabel);
    notifyListeners();
    try {
      final file = await capture.start();
      markCaptureEvent('Capture start: ${discovery.eventLabel}', source: 'atlas');
      markCaptureEvent('Marker mode: ${markerMode.name}', source: 'atlas_marker_mode');
      if (markerMode.usesVoice) {
        try {
          final audio = await voiceAnnotations.start(file);
          markCaptureEvent(
            'Voice annotation start: ${audio.uri.pathSegments.last}',
            source: 'voice',
          );
        } catch (_) {
          markCaptureEvent('Voice annotation unavailable', source: 'voice_error');
        }
      }
      notifyListeners();
      return file;
    } catch (_) {
      if (voiceAnnotations.isRecording || voiceAnnotations.isStopping) {
        await voiceAnnotations.stop();
      }
      discovery.finish();
      notifyListeners();
      rethrow;
    }
  }
"""
          if 'EventMarkerMode markerMode' not in r:
              if old_start not in r:
                  raise SystemExit('startCapture anchor missing')
              r = r.replace(old_start, new_start, 1)

          old_stop = """  Future<File?> stopCapture() {
    if (capture.isRecording) {
      markCaptureEvent('Capture stop', source: 'atlas');
    }
    if (discovery.isRunning) discovery.finish();
    notifyListeners();
    return capture.stop();
  }
"""
          new_stop = """  Future<File?> stopCapture() async {
    if (voiceAnnotations.isRecording || voiceAnnotations.isStopping) {
      if (capture.isRecording) {
        markCaptureEvent('Voice annotation stop', source: 'voice');
      }
      await voiceAnnotations.stop();
    }
    if (capture.isRecording) {
      markCaptureEvent('Capture stop', source: 'atlas');
    }
    if (discovery.isRunning) discovery.finish();
    notifyListeners();
    return capture.stop();
  }
"""
          if 'Future<File?> stopCapture() async' not in r:
              if old_stop not in r:
                  raise SystemExit('stopCapture anchor missing')
              r = r.replace(old_stop, new_stop, 1)
          rp.write_text(r, encoding='utf-8')

          up = Path('lib/linux_capture_page.dart')
          u = up.read_text(encoding='utf-8')
          u = u.replace("import 'dart:async';\n\n", '', 1)
          old_owner = """  final _eventLabel = TextEditingController(text: 'Brake');
  final VoiceAnnotationCapture _voice = VoiceAnnotationCapture();
  EventMarkerMode _markerMode = EventMarkerMode.click;
  bool _starting = false;
  bool _stopping = false;

  @override
  void initState() {
    super.initState();
    _voice.addListener(_voiceChanged);
  }

  void _voiceChanged() {
    if (mounted) setState(() {});
  }

  @override
  void dispose() {
    _voice.removeListener(_voiceChanged);
    if (_voice.isRecording) unawaited(_voice.stop());
    _eventLabel.dispose();
    _voice.dispose();
    super.dispose();
  }
"""
          new_owner = """  final _eventLabel = TextEditingController(text: 'Brake');
  EventMarkerMode _markerMode = EventMarkerMode.click;
  bool _starting = false;
  bool _stopping = false;

  @override
  void dispose() {
    _eventLabel.dispose();
    super.dispose();
  }
"""
          if 'final VoiceAnnotationCapture _voice' in u:
              if old_owner not in u:
                  raise SystemExit('UI owner anchor missing')
              u = u.replace(old_owner, new_owner, 1)

          a = u.index('  Future<void> _startCapture() async {')
          b = u.index('  Future<void> _stopCapture() async {', a)
          u = u[:a] + """  Future<void> _startCapture() async {
    final runtime = AtlasRuntime.instance;
    setState(() => _starting = true);
    try {
      await runtime.startCapture(
        eventLabel: _eventLabel.text,
        markerMode: _markerMode,
      );
      if (_markerMode.usesVoice && runtime.voiceAnnotations.lastError != null) {
        _showMessage(
          'CAN capture is still running. Voice could not start: '
          '${runtime.voiceAnnotations.lastError}',
        );
      }
    } catch (error) {
      _showMessage(error.toString());
    } finally {
      if (mounted) setState(() => _starting = false);
    }
  }

""" + u[b:]

          a = u.index('  Future<void> _stopCapture() async {')
          b = u.index('  void _showMessage(String message) {', a)
          u = u[:a] + """  Future<void> _stopCapture() async {
    final runtime = AtlasRuntime.instance;
    setState(() => _stopping = true);
    try {
      await runtime.stopCapture();
    } catch (error) {
      _showMessage(error.toString());
    } finally {
      if (mounted) setState(() => _stopping = false);
    }
  }

""" + u[b:]

          anchor = "        final runtime = AtlasRuntime.instance;\n        final phase = runtime.capture.phase;\n"
          if 'final voice = runtime.voiceAnnotations;' not in u:
              if anchor not in u:
                  raise SystemExit('UI runtime anchor missing')
              u = u.replace(anchor, "        final runtime = AtlasRuntime.instance;\n        final voice = runtime.voiceAnnotations;\n        final phase = runtime.capture.phase;\n", 1)
          u = u.replace('_voiceStatusCard()', '_voiceStatusCard(voice)')
          u = u.replace('Widget _voiceStatusCard() {', 'Widget _voiceStatusCard(VoiceAnnotationCapture voice) {', 1)
          u = u.replace('_voice.', 'voice.')
          if '_voice' in u:
              raise SystemExit('local voice reference remains')
          up.write_text(u, encoding='utf-8')
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- lib/core/atlas_runtime.dart lib/linux_capture_page.dart; then
            echo "No lifecycle changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/atlas_runtime.dart lib/linux_capture_page.dart
          git commit -m "Move voice capture lifecycle into Atlas runtime [voice-runtime-patch]"
          git push origin HEAD:feat/voice-event-markers
