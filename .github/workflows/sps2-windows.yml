name: Build SPS2 Capture Windows
on:
  workflow_dispatch:
  push:
    branches: [feature/sps2-capture-windows]
    paths:
      - 'sps2-windows/**'
      - '.github/workflows/sps2-windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SPS2Capture sps2-windows/sps2_capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: SPS2Capture-Windows
          path: dist/SPS2Capture.exe
          retention-days: 30
