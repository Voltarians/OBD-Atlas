name: Frontend Check

on:
  push:
    branches:
      - main
      - 'build/**'
  pull_request:

jobs:
  flutter-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure J2534 lifecycle proxy
        run: cmake -S native/j2534_proxy -B build/j2534_proxy -A x64 -DBUILD_TESTING=ON
      - name: Build J2534 lifecycle proxy
        run: cmake --build build/j2534_proxy --config Release
      - name: Test J2534 lifecycle transparency
        run: ctest --test-dir build/j2534_proxy -C Release --output-on-failure
      - name: Upload J2534 lifecycle proxy
        uses: actions/upload-artifact@v4
        with:
          name: OBD-Atlas-J2534-lifecycle-proxy
          path: build/j2534_proxy/Release/obd_atlas_j2534_proxy.dll
          if-no-files-found: error
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform projects
        shell: pwsh
        run: |
          flutter create --platforms=android,windows --project-name obd_atlas .
          Add-Content -Path android/gradle.properties -Value "kotlin.incremental=false"
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build Windows release
        run: flutter build windows --release
      - name: Upload Windows release build
        uses: actions/upload-artifact@v4
        with:
          name: OBD-Atlas-Windows-release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
      - name: Build Android APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OBD-Atlas-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
