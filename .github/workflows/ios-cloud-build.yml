name: iOS Cloud Build

on:
  push:
    branches:
      - feature/ios-testflight-foundation
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-cloud-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-unsigned:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter environment
        run: |
          flutter --version
          xcodebuild -version

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned app
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app OBD-Atlas-iOS-unsigned.zip

      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@v4
        with:
          name: OBD-Atlas-iOS-unsigned
          path: build/ios/iphoneos/OBD-Atlas-iOS-unsigned.zip
          if-no-files-found: error
