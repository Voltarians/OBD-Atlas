name: atlas_lys_usbcan
description: Native Windows ControlCAN transport for LYS/ZLG-compatible USBCAN-II adapters.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: AtlasLysUsbcanPluginCApi
